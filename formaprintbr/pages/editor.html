  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBH-QWEWiANHgDYbCCSlNfAyr-FtOuW8jw",
      authDomain: "formaprint-br.firebaseapp.com",
      projectId: "formaprint-br",
      storageBucket: "formaprint-br.firebasestorage.app",
      messagingSenderId: "483317627076",
      appId: "1:483317627076:web:0cf9ed3165085f7671b191"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Verificar se usuário está logado
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Usuário logado - carregar dados salvos
        console.log('Usuário logado no editor:', user.email);
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', user.email);
        
        // Tentar carregar currículo salvo
        try {
          const docRef = doc(db, "resumes", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            // Preencher formulário com dados salvos
            if (data.fullName) document.getElementById('fullName').value = data.fullName;
            if (data.cargo) document.getElementById('cargo').value = data.cargo;
            if (data.telefone) document.getElementById('telefone').value = data.telefone;
            if (data.email) document.getElementById('email').value = data.email;
            if (data.cidade) document.getElementById('cidade').value = data.cidade;
            if (data.estado) document.getElementById('estado').value = data.estado;
            if (data.linkedin) document.getElementById('linkedin').value = data.linkedin;
            if (data.objetivo) document.getElementById('objetivo').value = data.objetivo;
            if (data.area) document.getElementById('area').value = data.area;
          }
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
        }
      } else {
        // Usuário não logado - usar localStorage
        console.log('Usuário não logado - usando localStorage');
      }
    });

    // Auto-save no Firebase (se logado) ou localStorage
    async function autoSave() {
      const formData = {
        fullName: document.getElementById('fullName')?.value || '',
        cargo: document.getElementById('cargo')?.value || '',
        telefone: document.getElementById('telefone')?.value || '',
        email: document.getElementById('email')?.value || '',
        cidade: document.getElementById('cidade')?.value || '',
        estado: document.getElementById('estado')?.value || '',
        linkedin: document.getElementById('linkedin')?.value || '',
        objetivo: document.getElementById('objetivo')?.value || '',
        area: document.getElementById('area')?.value || '',
        updatedAt: new Date()
      };

      // Salvar no localStorage
      localStorage.setItem('resumeData', JSON.stringify(formData));

      // Salvar no Firebase se estiver logado
      const user = auth.currentUser;
      if (user) {
        try {
          await setDoc(doc(db, "resumes", user.uid), formData, { merge: true });
        } catch (error) {
          console.error('Erro ao salvar no Firebase:', error);
        }
      }
    }

    // Auto-save a cada 30 segundos
    setInterval(autoSave, 30000);

    // Salvar ao sair da página
    window.addEventListener('beforeunload', autoSave);
  </script>
</body>
</html>
