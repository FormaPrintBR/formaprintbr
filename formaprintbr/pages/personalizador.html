  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBH-QWEWiANHgDYbCCSlNfAyr-FtOuW8jw",
      authDomain: "formaprint-br.firebaseapp.com",
      projectId: "formaprint-br",
      storageBucket: "formaprint-br.firebasestorage.app",
      messagingSenderId: "483317627076",
      appId: "1:483317627076:web:0cf9ed3165085f7671b191"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Verificar pagamento e usuário logado
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Verificar se já pagou
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const pago = localStorage.getItem('paymentApproved') === 'true';
        
        if (status === 'approved' || pago) {
          // Liberar personalizador
          document.querySelector('.lock-message').style.display = 'none';
          document.querySelector('.personalizer-content').style.display = 'block';
          
          // Carregar dados do usuário
          try {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
              const userData = docSnap.data();
              if (userData.currículosComprados >= 1) {
                // Usuário tem fidelidade
                localStorage.setItem('fidelidade', 'true');
              }
            }
          } catch (error) {
            console.error('Erro ao carregar dados:', error);
          }
        } else {
          // Redirecionar para pagamento
          window.location.href = 'pagamento.html';
        }
      } else {
        // Verificar se pagou sem conta
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const pago = localStorage.getItem('paymentApproved') === 'true';
        
        if (status === 'approved' || pago) {
          document.querySelector('.lock-message').style.display = 'none';
          document.querySelector('.personalizer-content').style.display = 'block';
        } else {
          window.location.href = 'pagamento.html';
        }
      }
    });
  </script>
</body>
</html>
